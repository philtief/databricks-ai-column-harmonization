name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/ apps/ notebooks/ examples/
      - name: Ruff format check
        run: ruff format --check src/ tests/ apps/
      - name: Pytest
        run: pytest tests/ -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=80
