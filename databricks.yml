bundle:
  name: halvard-column-harmonization

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog for all tables (must exist).
    default: agent_marketplace_catalog
  schema_name:
    description: Schema for landing volume, bronze, control and harmonized tables.
    default: halvard_harmonization
  warehouse_id:
    description: Serverless SQL warehouse used by the app and Genie.
    default: 41754a8563a43a49
  ai_endpoint:
    description: Foundation model endpoint for ai_query mapping proposals.
    default: databricks-claude-sonnet-4-6  # sonnet-5 is not enabled for ai_query batch inference (checked 2026-10-06)
  lakebase_project:
    description: Lakebase Autoscaling project that holds the review workflow state.
    default: halvard-harmonization
  privileged_principals:
    description: Comma-separated users/SPs that see every country through the row filter.
    default: ""

targets:
  dev:
    default: true
    workspace:
      profile: pt
      root_path: /Workspace/Users/${workspace.current_user.userName}/halvard-column-harmonization
