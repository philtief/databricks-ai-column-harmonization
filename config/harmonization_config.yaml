# ==========================================================================
# Column Harmonization Configuration — Generic Starter
# ==========================================================================
# This file defines the source domain, target data model, and AI settings
# for the column harmonization workflow. Edit it to fit your own raw data
# and target schema.
#
# Quick start:
#   - To try the Spain property-insurance demo, copy the demo config:
#       cp examples/spain_demo/harmonization_config.yaml config/harmonization_config.yaml
#   - To start fresh, copy the placeholder template:
#       cp config/harmonization_config.yaml.template config/harmonization_config.yaml
#
# After editing:
#   databricks bundle deploy && databricks bundle run Column_Mapping_To_Global_Model
# ==========================================================================

# --- Source context (fed to the LLM when proposing column mappings) --------
source_context:
  # Short label shown in logs and prompts.
  domain: "Generic CRM contact records"

  # Identifier stored in control tables to distinguish this source.
  source_system: "GENERIC_CRM_RAW"

  # Raw table name. Must already exist in your <catalog>.<schema>.
  source_table: "crm_contacts_raw"

  # Description passed to the LLM. Be specific: language, domain, conventions.
  description: >
    Customer contact records from a generic CRM source. Source columns may use
    a mix of business shorthand and abbreviations. Target model uses standard
    English names suitable for downstream analytics.


# --- Target data model (the "ground truth" the LLM maps into) -------------
# Each column entry is shown to the LLM as a valid mapping target.
# The 'description' field is especially important: it helps the LLM
# distinguish between similarly named columns. Write it for an LLM reader.
target_model:
  table_name: "crm_contacts"

  columns:
    - name: contact_id
      type: STRING
      description: "Unique identifier for each contact"
      examples: ["C-001", "C-002", "C-003"]
      required: true
      semantic_group: identity

    - name: first_name
      type: STRING
      description: "Given (first) name of the contact"
      examples: ["Alice", "Bob"]
      required: true
      semantic_group: person

    - name: last_name
      type: STRING
      description: "Family (last) name of the contact"
      examples: ["Smith", "Jones"]
      required: true
      semantic_group: person

    - name: email
      type: STRING
      description: "Primary email address"
      examples: ["a@example.com"]
      required: true
      semantic_group: contact

    - name: phone_number
      type: STRING
      description: "Primary phone number in E.164 format"
      examples: ["+1-555-0100"]
      required: false
      semantic_group: contact

    - name: country
      type: STRING
      description: "ISO 3166 country name where the contact is located"
      examples: ["United States", "Germany"]
      required: true
      semantic_group: geography

    - name: created_at
      type: TIMESTAMP
      description: "Timestamp when the contact record was first created"
      examples: ["2024-01-15T10:00:00"]
      required: true
      semantic_group: time

    - name: lifecycle_stage
      type: STRING
      description: "Sales/marketing lifecycle stage"
      examples: ["lead", "prospect", "customer"]
      required: true
      semantic_group: lifecycle


# --- Mandatory source columns -----------------------------------------------
# Source columns that MUST be reviewed (approved or corrected) in the
# Databricks App before the workflow can proceed past the review gate
# (notebook 06).
mandatory_source_columns:
  - contact_id
  - email
  - country


# --- Semantic fields (eligible for optional value mapping) -----------------
# Target columns that may still contain values in the source language
# after column mapping is applied. Notebook 09 can translate these if
# approved entries exist in value_mapping_dictionary.
semantic_fields:
  - lifecycle_stage
  - country


# --- AI / LLM configuration -------------------------------------------------
# All knobs for the LLM call live here. The notebook reads this block via
# harmonization.llm.load_llm_config() and passes the result to ai_query().
ai:
  # Foundation model endpoint used by ai_query() in notebook 04.
  # Override at job-run time via the 'ai_endpoint' workflow parameter.
  endpoint: "databricks-gpt-5-2"

  # Optional: full prompt template using ${name} placeholders.
  # Static placeholders (filled at SQL-build time):
  #   ${context}            ${target_columns}   ${match_types}
  #   ${confidence_levels}  ${response_schema}
  # Dynamic placeholders (turned into SQL column references):
  #   ${local_column_name}  ${local_data_type}  ${sample_values}
  # If omitted, harmonization.llm.DEFAULT_PROMPT_TEMPLATE is used.
  # prompt_template: |
  #   You are a data harmonization expert.
  #   Source column "${local_column_name}" has type ${local_data_type}.
  #   Sample values: ${sample_values}.
  #   Domain context: ${context}.
  #   Valid targets: ${target_columns}.
  #   Match types: ${match_types}.
  #   Return JSON: ${response_schema}

  # Optional: vocabulary overrides. Defaults shown.
  # match_types: ["DIRECT", "SEMANTIC_TRANSLATION", "DERIVED", "NO_MATCH"]
  # confidence_levels: ["HIGH", "MEDIUM", "LOW"]
  # response_keys: ["global_column_name", "match_type", "rationale", "confidence"]

  # Optional: arbitrary extra placeholders accessible from prompt_template
  # via ${key}. Useful for injecting tone, language hints, custom rules.
  # extra_context:
  #   tone: "concise"
  #   target_language: "English"

  # Rough per-column token estimates for cost monitoring (notebook 04).
  estimated_prompt_tokens_per_column: 200
  estimated_response_tokens_per_column: 80
  estimated_cost_per_1k_tokens: 0.002
