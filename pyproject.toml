[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "column-harmonization"
version = "1.0.0"
description = "AI-powered column harmonization from local schemas to a global English model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "databricks-sdk>=0.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.8",
]
app = [
    "streamlit>=1.37.0",
    "pandas>=2.0.0",
    "databricks-sdk>=0.28.0",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a Databricks cluster (deselect with -m 'not integration')",
]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: runtime globals (F821), cell imports (E402), unused imports
# shared via %run (F401), f-strings in print statements (F541)
"notebooks/*.py" = ["F821", "E402", "F401", "F541"]

[tool.setuptools.packages.find]
where = ["src"]
