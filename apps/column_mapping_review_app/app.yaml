command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"
  - --server.enableCORS
  - "false"
  - --server.enableXsrfProtection
  - "false"
  - --server.enableWebsocketCompression
  - "false"

env:
  - name: CATALOG_NAME
    value: "agent_marketplace_catalog"
  - name: SCHEMA_NAME
    value: "column_harmonization_test"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "41754a8563a43a49"
  - name: WORKFLOW_JOB_ID
    value: "358353099383404"
