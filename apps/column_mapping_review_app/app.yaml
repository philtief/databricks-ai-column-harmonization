command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"
  - --server.enableCORS
  - "false"
  - --server.enableXsrfProtection
  - "false"
  - --server.enableWebsocketCompression
  - "false"

env:
  - name: CATALOG_NAME
    value: "your_catalog"
  - name: SCHEMA_NAME
    value: "harmonizing_agent"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "your_warehouse_id"
  - name: WORKFLOW_JOB_ID
    value: "your_job_id"
