# Two jobs per country run:
#   propose: raw files -> Lakeflow bronze -> AI mapping proposals -> Lakebase review queue -> evaluation
#   publish: Lakebase decisions -> review gate -> dictionary -> harmonized table -> DQ -> governance
# Reviewers work in the app between the two; the app's Publish button triggers the publish job.
x-params: &params
  - name: catalog_name
    default: ${var.catalog_name}
  - name: schema_name
    default: ${var.schema_name}
  - name: source_country
    default: ES
  - name: ai_endpoint
    default: ${var.ai_endpoint}
  - name: mapping_version
    default: v1
  - name: lakebase_endpoint
    default: projects/${var.lakebase_project}/branches/production/endpoints/primary
  - name: app_name
    default: halvard-harmonization-review

resources:
  jobs:
    halvard_propose_mappings:
      name: halvard_propose_mappings
      max_concurrent_runs: 1
      tags:
        project: halvard-column-harmonization
      parameters: *params
      tasks:
        - task_key: bootstrap_catalog
          notebook_task:
            notebook_path: ../notebooks/00_bootstrap_catalog.py
        - task_key: generate_country_files
          depends_on: [{task_key: bootstrap_catalog}]
          notebook_task:
            notebook_path: ../examples/generate_country_files.py
        - task_key: ingest_country_feeds
          depends_on: [{task_key: generate_country_files}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.ingest_country_feeds.id}
        - task_key: create_global_model_and_control_tables
          depends_on: [{task_key: bootstrap_catalog}]
          notebook_task:
            notebook_path: ../notebooks/02_create_global_model_and_control_tables.py
        - task_key: inventory_source_columns
          depends_on:
            - task_key: ingest_country_feeds
            - task_key: create_global_model_and_control_tables
          notebook_task:
            notebook_path: ../notebooks/03_inventory_source_columns.py
        - task_key: ai_propose_column_mappings
          depends_on: [{task_key: inventory_source_columns}]
          notebook_task:
            notebook_path: ../notebooks/04_ai_propose_column_mappings.py
        - task_key: publish_review_queue
          depends_on: [{task_key: ai_propose_column_mappings}]
          notebook_task:
            notebook_path: ../notebooks/05_prepare_app_review_views.py
        - task_key: evaluate_ai_proposals
          depends_on: [{task_key: ai_propose_column_mappings}]
          notebook_task:
            notebook_path: ../notebooks/11_evaluate_ai_proposals.py

    halvard_publish_harmonized:
      name: halvard_publish_harmonized
      max_concurrent_runs: 1
      tags:
        project: halvard-column-harmonization
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: source_country
          default: ES
        - name: ai_endpoint
          default: ${var.ai_endpoint}
        - name: mapping_version
          default: v1
        - name: lakebase_endpoint
          default: projects/${var.lakebase_project}/branches/production/endpoints/primary
        - name: privileged_principals
          default: ${var.privileged_principals}
        - name: app_name
          default: halvard-harmonization-review
      tasks:
        - task_key: column_mapping_review_gate
          notebook_task:
            notebook_path: ../notebooks/06_column_mapping_review_gate.py
        - task_key: build_column_mapping_dictionary
          depends_on: [{task_key: column_mapping_review_gate}]
          notebook_task:
            notebook_path: ../notebooks/07_build_column_mapping_dictionary.py
        - task_key: apply_approved_column_mappings
          depends_on: [{task_key: build_column_mapping_dictionary}]
          notebook_task:
            notebook_path: ../notebooks/08_apply_approved_column_mappings.py
        - task_key: value_mapping
          depends_on: [{task_key: apply_approved_column_mappings}]
          notebook_task:
            notebook_path: ../notebooks/09_optional_value_mapping.py
        - task_key: validate_and_monitor
          depends_on: [{task_key: value_mapping}]
          notebook_task:
            notebook_path: ../notebooks/10_validate_and_monitor.py
        - task_key: apply_governance
          depends_on: [{task_key: validate_and_monitor}]
          notebook_task:
            notebook_path: ../notebooks/12_apply_governance.py
