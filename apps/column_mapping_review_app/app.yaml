command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"
  - --server.enableCORS
  - "false"
  - --server.enableXsrfProtection
  - "false"
  - --server.enableWebsocketCompression
  - "false"

env:
  - name: CATALOG_NAME
    value: "agent_marketplace_catalog"
  - name: SCHEMA_NAME
    value: "halvard_harmonization"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: PUBLISH_JOB_ID
    valueFrom: publish-job
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
