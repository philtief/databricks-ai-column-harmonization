command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"
  - --server.enableCORS
  - "false"
  - --server.enableXsrfProtection
  - "false"
  - --server.enableWebsocketCompression
  - "false"

env:
  - name: CATALOG_NAME
    value: ""  # Set to your Unity Catalog catalog name
  - name: SCHEMA_NAME
    value: ""  # Set to match schema_name in databricks.yml (default: harmonizing_agent)
  - name: DATABRICKS_WAREHOUSE_ID
    value: ""  # databricks warehouses list --output json | jq '.[0].id'
  - name: WORKFLOW_JOB_ID
    value: ""  # databricks jobs list --name Column_Mapping_To_Global_Model --output json | jq '.[0].job_id'
