name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: black --check --line-length 120 src/ tests/ apps/
      - run: flake8 src/ tests/ apps/ notebooks/
      - run: mypy src/
      - run: pytest tests/ -m "not integration" --cov=src --cov-report=term-missing
